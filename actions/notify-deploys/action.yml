name: Notify #deploys
description: Post a system change to the #deploys Slack channel (SOC 2, system changes communicated).

inputs:
  webhook-url:
    description: Slack incoming webhook for #deploys (pass secrets.SLACK_DEPLOYS_WEBHOOK_URL).
    required: true
  application:
    description: What changed, e.g. "Backend", "CLI" or "Infrastructure".
    required: true
  version:
    description: The release tag or commit deployed. Leave empty when there is none.
    default: ''
  environment:
    description: production, staging or uat. Leave empty for a release.
    default: ''
  link:
    description: Where to read more on success, such as the release notes. Otherwise the run is linked.
    default: ''
  results:
    description: >-
      Whitespace-separated job results, e.g. join(needs.*.result, ' '). Any failure posts Failed,
      else any cancelled posts Cancelled, else all success posts Success, else Skipped.
    required: true

runs:
  using: composite
  steps:
    - name: Post to Slack
      shell: bash
      env:
        WEBHOOK_URL: ${{ inputs.webhook-url }}
        APPLICATION: ${{ inputs.application }}
        VERSION: ${{ inputs.version }}
        ENVIRONMENT: ${{ inputs.environment }}
        LINK: ${{ inputs.link }}
        RESULTS: ${{ inputs.results }}
        ACTOR: ${{ github.triggering_actor }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        read -ra results <<<"$(tr -s '[:space:]' ' ' <<<"$RESULTS")"
        # GitHub doesn't enforce required inputs on composite actions.
        if [ -z "$APPLICATION" ] || [ "${#results[@]}" -eq 0 ]; then
          echo "::error::The application and results inputs are required."
          exit 1
        fi
        case " ${results[*]} " in
          *" failure "*) outcome=":x: Failed" ;;
          *" cancelled "*) outcome=":warning: Cancelled" ;;
          *)
            # A skipped result means the change didn't fully run.
            outcome=":white_check_mark: Success"
            for result in "${results[@]}"; do
              [ "$result" = success ] || outcome=":fast_forward: Skipped"
            done
            ;;
        esac
        # A failed change may not have published what the link points to.
        [ "$outcome" = ":white_check_mark: Success" ] && [ -n "$LINK" ] || LINK=$RUN_URL
        # Escape Slack's control characters so an input can't ping or fake a link.
        jq -n --arg application "$APPLICATION" --arg outcome "$outcome" \
          --arg version "$VERSION" --arg environment "$ENVIRONMENT" \
          --arg actor "$ACTOR" --arg link "$LINK" '
          def esc: gsub("&"; "&amp;") | gsub("<"; "&lt;") | gsub(">"; "&gt;");
          def row($label; $value): if $value == "" then empty else "*\($label):* \($value)" end;
          ($environment | if . == "uat" then "UAT" else (.[:1] | ascii_upcase) + .[1:] end) as $env
          | ($outcome | sub("^:[a-z_]+: "; "")) as $word
          | {
              text: "\($word): \($application | esc) \($version | esc)",
              blocks: [{type: "section", text: {type: "mrkdwn", text: ([
                row("Application"; $application | esc),
                row("Outcome"; $outcome),
                row("Version"; $version | esc),
                row("Environment"; $env | esc),
                row("Triggered by"; $actor | esc),
                row("Details"; "<\($link)|View>")
              ] | join("\n"))}}]
            }' \
          | curl -fsS --max-time 30 -X POST -H 'Content-Type: application/json' --data @- "$WEBHOOK_URL"
