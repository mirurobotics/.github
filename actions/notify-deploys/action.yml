name: Notify #deploys
description: Post a system change to the #deploys Slack channel (SOC 2, system changes communicated).

inputs:
  webhook-url:
    description: Slack incoming webhook for #deploys (pass secrets.SLACK_DEPLOYS_WEBHOOK_URL).
    required: true
  application:
    description: What changed, e.g. "Backend", "CLI" or "Infrastructure".
    required: true
  version:
    description: The release tag or commit deployed. Leave empty when there is none.
    default: ''
  environment:
    description: production, staging or uat. Leave empty for a release.
    default: ''
  link:
    description: Where to read more on success, such as the release notes. Otherwise the run is linked.
    default: ''
  results:
    description: >-
      Whitespace-separated job results, e.g. join(needs.*.result, ' '). Any failure posts Failed,
      else any cancelled posts Cancelled, else all success posts Success, else Skipped.
    required: true

runs:
  using: composite
  steps:
    - name: Post to Slack
      shell: bash
      env:
        WEBHOOK_URL: ${{ inputs.webhook-url }}
        APPLICATION: ${{ inputs.application }}
        VERSION: ${{ inputs.version }}
        ENVIRONMENT: ${{ inputs.environment }}
        LINK: ${{ inputs.link }}
        RESULTS: ${{ inputs.results }}
        ACTOR: ${{ github.triggering_actor }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        read -ra results <<<"$(tr -s '[:space:]' ' ' <<<"$RESULTS")"
        # GitHub doesn't enforce required inputs on composite actions.
        if [ -z "$APPLICATION" ] || [ "${#results[@]}" -eq 0 ]; then
          echo "::error::The application and results inputs are required."
          exit 1
        fi
        case "$ENVIRONMENT" in
          production) environment=Production ;;
          staging) environment=Staging ;;
          uat) environment=UAT ;;
          '') environment= ;;
          *)
            echo "::error::The environment input must be production, staging, uat or empty."
            exit 1
            ;;
        esac
        # Unicode emoji, since shortcodes don't render in a code block.
        case " ${results[*]} " in
          *" failure "*) status=Failed emoji=❌ ;;
          *" cancelled "*) status=Cancelled emoji=⚠️ ;;
          *)
            # A skipped result means the change didn't fully run.
            status=Success emoji=✅
            for result in "${results[@]}"; do
              [ "$result" = success ] || status=Skipped emoji=⏭️
            done
            ;;
        esac
        # A failed change may not have published what the link points to.
        [ "$status" = Success ] && [ -n "$LINK" ] || LINK=$RUN_URL
        # Escape Slack's control characters and turn off mention parsing so an input can't ping or fake a link.
        jq -n --arg application "$APPLICATION" --arg status "$status" --arg emoji "$emoji" \
          --arg version "$VERSION" --arg environment "$environment" \
          --arg actor "$ACTOR" --arg link "$LINK" '
          def esc: gsub("&"; "&amp;") | gsub("<"; "&lt;") | gsub(">"; "&gt;");
          # A code block keeps the values aligned.
          def row($label; $value):
            if $value == "" then empty else $label + " " * (14 - ($label | length)) + $value end;
          ([
            row("Application"; $application),
            row("Outcome"; "\($emoji) \($status)"),
            row("Version"; $version),
            row("Environment"; $environment),
            row("Triggered by"; $actor)
          ] | join("\n") | esc) as $rows
          | {
              text: ([if $environment == "" then empty else "[\($environment)]" end,
                  "\($status):", $application, $version]
                | map(select(. != "")) | join(" ") | esc),
              blocks: [{type: "section", text: {
                type: "mrkdwn", verbatim: true, text: "```\n\($rows)\n```\n<\($link)|View details>"
              }}]
            }' \
          | curl -fsS --max-time 30 -X POST -H 'Content-Type: application/json' --data @- "$WEBHOOK_URL"
