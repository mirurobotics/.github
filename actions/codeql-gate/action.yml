name: CodeQL nightly gate
description: >-
  Internal to Miru. On a scheduled run, outputs scan=false when main hasn't moved
  since the last successful run of the calling workflow. Every other event scans.

inputs:
  token:
    description: Token with actions:read on the calling repository.
    default: ${{ github.token }}

outputs:
  scan:
    description: "'true' when the CodeQL scan should run."
    value: ${{ steps.check.outputs.scan }}

runs:
  using: composite
  steps:
    - name: Check for commits since the last scan
      id: check
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        EVENT: ${{ github.event_name }}
        REPO: ${{ github.repository }}
        RUN_ID: ${{ github.run_id }}
        SHA: ${{ github.sha }}
      run: |
        scan=true
        if [ "$EVENT" = "schedule" ]; then
          workflow_id=$(gh api "repos/$REPO/actions/runs/$RUN_ID" \
            --jq .workflow_id) || true
          runs="repos/$REPO/actions/workflows/$workflow_id/runs"
          last_sha=$(gh api "$runs?branch=main&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // ""') || true
          if [ -n "$last_sha" ] && [ "$last_sha" = "$SHA" ]; then
            echo "main is still at $SHA, which was already scanned."
            scan=false
          fi
        fi
        echo "scan=$scan" >> "$GITHUB_OUTPUT"
