# Reusable automated AI code review, required before merge.
#
# Posts the `ai-review` commit status on the PR head commit. Callers mark
# that status as a required check so a PR cannot merge until Claude has
# reviewed its latest commit and found no blocking issues.
#
# Every push, draft or ready, also gets a design review. One Claude
# session asks the design-review skill's ten questions of the whole PR
# and posts only new findings as advisory "Design (...)" comments, with
# its own summary. It sets no status and its threads never block.
# Drafts get only the design review; marking the PR ready adds the
# required review below, which runs alongside it.
#
# Each push to a ready PR, one Claude session runs read-only reviewer
# sub-agents: one for a small change, three in parallel (correctness,
# safety, quality) for a larger one. It then checks their findings
# against the code, posts the ones that hold up and sets the verdict.
# Each PR gets one summary comment, edited every round. It records the
# head it reviewed, so later rounds review and post nits only on what
# changed since. Generated files are reviewed and counted like any
# other file.
#
# Call it from a `pull_request_target` workflow so the caller runs from
# the base branch and a PR cannot edit or delete its own review. The PR
# head is checked out into a subdirectory and only read, never executed.
#
# This lives in the public .github repo so public repos can call it too;
# GitHub only lets private repos call workflows from a private repo.
#
#   on:
#     pull_request_target:
#       types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
#   concurrency:
#     group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
#     cancel-in-progress: true
#   permissions:
#     contents: read
#     pull-requests: write
#     statuses: write
#   jobs:
#     ai-review:
#       uses: mirurobotics/.github/.github/workflows/ai-review.yml@<commit-sha>
#       with:
#         effort: high  # optional; also `model` and `runs-on`
#       secrets:
#         ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
#         CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
#         AGENTS_READ_TOKEN: ${{ secrets.AGENTS_READ_TOKEN }}  # private repos
#
# Pin to a commit SHA so a change here reaches a repo only through a
# reviewed PR that bumps it. The prompts and scripts in ai-review/ are read at
# that same commit.
#
# Set ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN (`claude setup-token`)
# as both an Actions and a Dependabot secret. The caller repo must allow
# `anthropics/claude-code-action@*`.
#
# Private repos must pass AGENTS_READ_TOKEN (Contents: read on
# mirurobotics/agents), set as both an Actions and a Dependabot
# organization secret. Reviewers read the miru-internal rules and skills
# from mirurobotics/agents at AGENTS_REF; without the token the review
# fails. Add the `AGENTS_READ_TOKEN:` line before bumping the pin:
# pull_request_target runs the base branch's caller, so once a bump
# without it merges, the PR that adds it fails too. Public repos skip
# the rules and skills, since comments could quote them.

# yamllint disable rule:line-length
name: AI Review

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner label
        type: string
        default: ubuntu-latest
      model:
        description: Claude model used for the review
        type: string
        default: claude-opus-5-5
      effort:
        description: Claude effort level (low, medium, high, xhigh, max)
        type: string
        default: high
    secrets:
      ANTHROPIC_API_KEY:
        description: Anthropic API key. Set this or CLAUDE_CODE_OAUTH_TOKEN.
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        description: Claude Code OAuth token from `claude setup-token` (Pro/Max/Team plans).
        required: false
      AGENTS_READ_TOKEN:
        description: Read access to mirurobotics/agents, for the miru-internal rules and skills. Required in private repos.
        required: false

env:
  STATUS_CONTEXT: ai-review
  # mirurobotics/agents commit the miru-internal rules and skills come from.
  AGENTS_REF: 823712338d20adff57b39ab69ac35f09a47b2e37

jobs:
  # Every push, plus switches between draft and ready. Callers must
  # subscribe to only these: any other event cancels a running review.
  review:
    if: contains(fromJSON('["opened","synchronize","reopened","ready_for_review","converted_to_draft"]'), github.event.action)
    timeout-minutes: 90
    runs-on: ${{ inputs.runs-on }}
    strategy:
      # A failed design review must not cancel the required one.
      fail-fast: false
      matrix:
        # design on every PR, plus the required review once ready.
        phase: ${{ fromJSON(github.event.pull_request.draft && '["design"]' || '["design","review"]') }}
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
      PHASE: ${{ matrix.phase }}
      AI_REVIEW_LIB: ${{ github.workspace }}/ai-review-src/ai-review/lib
    steps:
      # Base branch at the workspace root so Claude's config (CLAUDE.md,
      # .claude/) comes from trusted code; PR head in a subdirectory.
      - name: Checkout base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Full history, so collect.js can find the merge base and the last
      # reviewed head with git.
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr-head
          fetch-depth: 0
          persist-credentials: false

      # This workflow's prompts and scripts, at the commit the caller
      # pinned. The github context names the caller's workflow; job names
      # this one.
      - name: Checkout AI review prompts and scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: ai-review-src
          sparse-checkout: ai-review
          persist-credentials: false

      - name: Set status pending
        if: env.PHASE == 'review'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await require(`${process.env.AI_REVIEW_LIB}/record.js`).pending({ github, context })

      # A missing or expired token fails the review, rather than quietly
      # reviewing without the skills.
      - name: Require AGENTS_READ_TOKEN
        if: github.event.repository.private
        env:
          TOKEN: ${{ secrets.AGENTS_READ_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Pass AGENTS_READ_TOKEN, set as an Actions and a Dependabot organization secret."
            exit 1
          fi

      - name: Checkout miru-internal rules and skills
        if: github.event.repository.private
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mirurobotics/agents
          ref: ${{ env.AGENTS_REF }}
          token: ${{ secrets.AGENTS_READ_TOKEN }}
          path: miru-internal
          persist-credentials: false

      # The description, the diff, earlier review rounds and the summary
      # comment to edit (ai-review/lib/collect.js), then the phase's prompt,
      # Claude arguments and reviewers (ai-review/lib/plan.js). Fetched here
      # so Claude never gets a token that can post statuses.
      - name: Prepare review
        id: prepare
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { files, delta } = await require(`${process.env.AI_REVIEW_LIB}/collect.js`).collect({ github, context, core, exec })
            require(`${process.env.AI_REVIEW_LIB}/plan.js`).plan({ core, files, delta })

      # Each phase's tools, turns and output schema are in plan.js. The
      # timeout stays under the job's so Record can still set an error
      # status if the session hangs.
      - name: Claude
        id: claude
        timeout-minutes: 80
        uses: anthropics/claude-code-action@8ce9314fa9a404564fa7e954cd84f25bcba2b829 # v1.0.236
        env:
          # Keeps reviewers in the foreground, so the session waits for them.
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          allowed_bots: "dependabot[bot],stlc-sealback-bot[bot]"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            PR AUTHOR: ${{ github.event.pull_request.user.login }}
            HEAD SHA: ${{ github.event.pull_request.head.sha }}

            ${{ steps.prepare.outputs.prompt }}
          claude_args: |
            --model ${{ inputs.model }}
            --effort ${{ inputs.effort }}
            --add-dir pr-head
            ${{ steps.prepare.outputs.claude_args }}

      # Edits the phase's summary comment and, for the required review,
      # sets the status (ai-review/lib/record.js).
      - name: Record
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RESULT: ${{ steps.claude.outputs.structured_output }}
          COMMENT_ID: ${{ steps.prepare.outputs.comment_id }}
        with:
          script: |
            await require(`${process.env.AI_REVIEW_LIB}/record.js`).record({ github, context, core })
