# Reusable automated AI code review, required before merge.
#
# Posts the `ai-review` commit status on the PR head commit. Callers mark
# that status as a required check so a PR cannot merge until Claude has
# reviewed its latest commit and found no blocking issues.
#
# Draft PRs get a design review instead, when the draft opens or
# reopens, when a ready PR goes back to draft, and when someone adds the
# `ai-design-review` label (removed again after the run, so it can be
# re-added). Pushes to a draft run nothing, so an agent fixing design
# comments can't loop on them. One Claude session asks the design-review
# skill's ten questions of the whole PR and posts only new findings as
# advisory "Design (...)" comments, with its own summary. It sets no
# status, since a draft can't merge, and its threads never block.
# Marking the PR ready starts the review below.
#
# Each push, one Claude session runs read-only reviewer sub-agents: one
# for a small change, three in parallel (correctness, safety, quality)
# for a larger one. It then checks their findings
# against the code, posts the ones that hold up and sets the verdict.
# Each PR gets one summary comment, edited every round. It records the
# head it reviewed, so later rounds review and post nits only on what
# changed since. Generated files are reviewed and counted like any
# other file.
#
# Call it from a `pull_request_target` workflow so the caller runs from
# the base branch and a PR cannot edit or delete its own review. The PR
# head is checked out into a subdirectory and only read, never executed.
#
# This lives in the public .github repo so public repos can call it too;
# GitHub only lets private repos call workflows from a private repo.
#
#   on:
#     pull_request_target:
#       types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, labeled]
#   # Draft and label events each get their own group, so a push to a
#   # draft or an unrelated label never cancels a running review. Only a
#   # push to a ready PR replaces the review in progress.
#   concurrency:
#     group: ${{ github.workflow }}-${{ github.event.pull_request.number }}-${{ (github.event.pull_request.draft || github.event.action == 'labeled') && github.run_id || 'review' }}
#     cancel-in-progress: true
#   permissions:
#     contents: read
#     pull-requests: write
#     statuses: write
#   jobs:
#     ai-review:
#       uses: mirurobotics/.github/.github/workflows/ai-review.yml@<commit-sha>
#       with:
#         effort: high  # optional; also `model` and `runs-on`
#       secrets:
#         ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
#         CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
#         AGENTS_READ_TOKEN: ${{ secrets.AGENTS_READ_TOKEN }}  # private repos
#
# Pin to a commit SHA so a change here reaches a repo only through a
# reviewed PR that bumps it. The prompts in ai-review/prompts are read at
# that same commit.
#
# Set ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN (`claude setup-token`)
# as both an Actions and a Dependabot secret. The caller repo must allow
# `anthropics/claude-code-action@*`.
#
# Private repos must pass AGENTS_READ_TOKEN (Contents: read on
# mirurobotics/agents), set as both an Actions and a Dependabot
# organization secret. Reviewers read the miru-internal rules and skills
# from mirurobotics/agents at AGENTS_REF; without the token the review
# fails. Add the `AGENTS_READ_TOKEN:` line before bumping the pin:
# pull_request_target runs the base branch's caller, so once a bump
# without it merges, the PR that adds it fails too. Public repos skip
# the rules and skills, since comments could quote them.

# yamllint disable rule:line-length
name: AI Review

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner label
        type: string
        default: ubuntu-latest
      model:
        description: Claude model used for the review
        type: string
        default: claude-opus-5-5
      effort:
        description: Claude effort level (low, medium, high, xhigh, max)
        type: string
        default: high
    secrets:
      ANTHROPIC_API_KEY:
        description: Anthropic API key. Set this or CLAUDE_CODE_OAUTH_TOKEN.
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        description: Claude Code OAuth token from `claude setup-token` (Pro/Max/Team plans).
        required: false
      AGENTS_READ_TOKEN:
        description: Read access to mirurobotics/agents, for the miru-internal rules and skills. Required in private repos.
        required: false

env:
  STATUS_CONTEXT: ai-review
  # mirurobotics/agents commit the miru-internal rules and skills come from.
  AGENTS_REF: 823712338d20adff57b39ab69ac35f09a47b2e37

jobs:
  # Ready PRs: every push. Drafts: only the events that ask for a design
  # review. Other events, such as other labels, run nothing.
  review:
    if: >-
      ${{ (!github.event.pull_request.draft
          && contains(fromJSON('["opened","synchronize","reopened","ready_for_review"]'), github.event.action))
        || (github.event.pull_request.draft
          && (contains(fromJSON('["opened","reopened","converted_to_draft"]'), github.event.action)
            || (github.event.action == 'labeled' && github.event.label.name == 'ai-design-review'))) }}
    timeout-minutes: 90
    runs-on: ${{ inputs.runs-on }}
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
      # design on drafts, cleanup (the required review) once ready.
      PHASE: ${{ github.event.pull_request.draft && 'design' || 'cleanup' }}
    steps:
      - name: Set status pending
        if: env.PHASE == 'cleanup'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state=pending -f context="$STATUS_CONTEXT" \
            -f description="Claude is reviewing this commit" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      # Base branch at the workspace root so Claude's config (CLAUDE.md,
      # .claude/) comes from trusted code; PR head in a subdirectory.
      - name: Checkout base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr-head
          persist-credentials: false

      # This workflow's prompts, at the commit the caller pinned. The github
      # context names the caller's workflow; job names this one.
      - name: Checkout AI review prompts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: ai-review-src
          sparse-checkout: ai-review/prompts
          persist-credentials: false

      # A missing or expired token fails the review, rather than quietly
      # reviewing without the skills.
      - name: Require AGENTS_READ_TOKEN
        if: github.event.repository.private
        env:
          TOKEN: ${{ secrets.AGENTS_READ_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Pass AGENTS_READ_TOKEN, set as an Actions and a Dependabot organization secret."
            exit 1
          fi

      - name: Checkout miru-internal rules and skills
        if: github.event.repository.private
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mirurobotics/agents
          ref: ${{ env.AGENTS_REF }}
          token: ${{ secrets.AGENTS_READ_TOKEN }}
          path: miru-internal
          persist-credentials: false

      # The description, the diff, earlier review rounds and the summary
      # comment to edit. Fetched here so Claude never gets `gh api`, whose
      # token can post statuses.
      - name: Collect review context
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          # Fail loudly: missing context would quietly weaken the review.
          set -euo pipefail
          dir="$GITHUB_WORKSPACE/ai-review-context"
          mkdir -p "$dir"
          printf '# %s\n\n%s\n' "$TITLE" "$BODY" >"$dir/pr-description.md"

          # From the files API, since GitHub won't send the whole diff of a
          # PR over 300 files. It lists at most 3000, so fail rather than
          # pass a review that can't see them all.
          files="$RUNNER_TEMP/pr-files.json"
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
            | jq -s 'add // []' >"$files"
          listed=$(jq length "$files")
          total=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .changed_files)
          if [ "$listed" -lt "$total" ]; then
            echo "::error::GitHub lists only $listed of this PR's $total files, so it can't be reviewed. Split it into smaller PRs."
            exit 1
          fi
          # Line breaks in paths become spaces, so a name can't fake a header.
          jq -r '.[] | (.filename | gsub("[\r\n]"; " ")) as $new
            | (.previous_filename // .filename | gsub("[\r\n]"; " ")) as $old
            | "diff --git a/\($old) b/\($new)\n"
              + (if .status == "added" then "new file\n"
                elif .status == "removed" then "deleted file\n"
                elif .status == "renamed" then "rename from \($old)\nrename to \($new)\n"
                else "" end)
              + (.patch // "(no patch from GitHub: binary, only renamed or its mode changed, or too large to diff)")' \
            "$files" >"$dir/pr.diff"

          # Earlier threads, marked resolved per GraphQL, and the PR
          # conversation, kept apart from the reviewers' inputs. Each body is
          # quoted with "> " so it can't pass for the surrounding structure.
          history="$GITHUB_WORKSPACE/ai-review-history"
          mkdir -p "$history"
          # shellcheck disable=SC2016 # $owner etc. are GraphQL variables
          resolved=$(gh api graphql --paginate \
            -f owner="${GITHUB_REPOSITORY%/*}" -f repo="${GITHUB_REPOSITORY#*/}" \
            -F number="$PR_NUMBER" -f query='
              query($owner: String!, $repo: String!, $number: Int!, $endCursor: String) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    reviewThreads(first: 100, after: $endCursor) {
                      pageInfo { hasNextPage endCursor }
                      nodes { isResolved comments(first: 1) { nodes { databaseId } } }
                    }
                  }
                }
              }' \
            | jq -cs '[.[].data.repository.pullRequest.reviewThreads.nodes[]
              | {key: (.comments.nodes[0].databaseId | tostring), value: .isResolved}]
              | from_entries')
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/comments" \
            | jq -rs --argjson resolved "$resolved" 'add // []
              | group_by(.in_reply_to_id // .id)
              | map(sort_by(.created_at)) | sort_by(.[0].created_at) | .[]
              | .[0] as $root
              | "## \($root.path | gsub("[\r\n]"; " "))"
                + (if $root.subject_type == "file" then " (file comment)"
                   elif $root.line then ":\($root.line)"
                   else ":\($root.original_line) (outdated)" end)
                + (if $resolved[$root.id | tostring] then " (resolved)" else "" end)
                + " at \($root.original_commit_id[0:7])\n\n"
                + (map("**\(.user.login)** (\(.author_association), \(.created_at)):\n\n"
                    + ((.body // "") | split("\n") | map("> " + .) | join("\n")))
                  | join("\n\n"))
                + "\n"' >"$history/review-threads.md"
          comments="$RUNNER_TEMP/issue-comments.json"
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            | jq -s 'add // []' >"$comments"
          jq -r '.[] | "## \(.user.login) (\(.author_association), \(.created_at))\n\n"
            + ((.body // "") | split("\n") | map("> " + .) | join("\n")) + "\n"' \
            "$comments" >"$history/conversation.md"
          # The one summary comment this phase edits each round, and the
          # head it last reviewed. The last marker wins, since the model
          # writes the text above it.
          prefix="### AI review:"
          if [ "$PHASE" = design ]; then prefix="### AI design review:"; fi
          summary=$(jq -c --arg prefix "$prefix" '[.[] | select(.user.login == "github-actions[bot]"
            and ((.body // "") | startswith($prefix)))] | last // {}' "$comments")
          id=$(jq -r '.id // ""' <<<"$summary")
          echo "comment_id=$id" >>"$GITHUB_OUTPUT"
          last_sha=$(jq -r '[(.body // "") | scan("<!-- ai-review sha=([0-9a-f]{40}) -->")] | last | .[0] // ""' <<<"$summary")

          # Changes since the last reviewed head, which later rounds review.
          # After a force-push or rebase it isn't an ancestor, so there is no
          # delta.diff and the whole PR is reviewed. Design reviews always
          # read the whole PR.
          if [ -n "$last_sha" ] && [ "$PHASE" = cleanup ]; then
            compare="repos/$GITHUB_REPOSITORY/compare/$last_sha...$SHA"
            status=$(gh api "$compare?per_page=1" --jq .status || true)
            if [ "$status" = ahead ] || [ "$status" = identical ]; then
              gh api -H "Accept: application/vnd.github.diff" "$compare" >"$history/delta.diff" \
                || rm -f "$history/delta.diff"
            fi
          fi
          if [ -f "$history/delta.diff" ]; then
            cp "$history/delta.diff" "$dir/delta.diff"
            echo "Reviewing changes since ${last_sha:0:7}"
          else
            echo "Reviewing the whole PR"
          fi

      # Each reviewer follows reviewer.md and one angle file, which lists
      # the lenses it covers (reviewer.md and the lenses are in
      # ai-review/prompts). The whole PR's size picks the lenses. Up to 100
      # reviewed lines (the delta's, on later rounds) get one reviewer;
      # more get three.
      - name: Write reviewer instructions
        if: env.PHASE == 'cleanup'
        run: |
          set -euo pipefail
          dir="$GITHUB_WORKSPACE/ai-review-context"
          files="$RUNNER_TEMP/pr-files.json"
          total=$(jq '[.[] | .additions + .deletions] | add // 0' "$files")
          lines=$total
          if [ -f "$dir/delta.diff" ]; then
            # Changed lines inside hunks, not the ---/+++ file headers.
            lines=$(awk '/^diff --git /{h=1} /^@@/{h=0; next} !h && /^[-+]/{n++} END{print n+0}' "$dir/delta.diff")
          fi
          tests=$(jq 'any(.[]; (.filename, .previous_filename // empty) | test("(_tests?|_spec|\\.test|\\.spec|Tests?)\\.|(^|/)(test_|tests?[./]|__tests__/|spec/|testdata/|conftest\\.py$)"))' "$files")
          echo "$total changed lines, $lines to review; test files changed: $tests"
          mkdir -p "$dir/angles"
          cp -r ai-review-src/ai-review/prompts/reviewer.md ai-review-src/ai-review/prompts/lenses "$dir/"
          # angle NAME LENS...: NAME's reviewer covers each listed lens.
          angle() {
            name=$1
            shift
            {
              echo "Your angle covers these lenses. Read each file and review from all of them:"
              printf -- '- ./ai-review-context/lenses/%s.md\n' "$@"
            } >"$dir/angles/$name.md"
          }

          safety=security quality=
          if [ "$total" -gt 100 ]; then safety="security reliability"; fi
          if [ "$total" -gt 100 ] || [ "$tests" = true ]; then quality=tests; fi
          if [ "$total" -ge 401 ]; then quality="tests documentation questions"; fi
          # Word splitting is intended: each variable is a list of lenses.
          # shellcheck disable=SC2086
          if [ "$lines" -le 100 ]; then
            angle review correctness contracts $safety $quality
          else
            angle correctness correctness contracts
            angle safety $safety
            if [ -n "$quality" ]; then angle quality $quality; fi
          fi
          head -n 100 "$dir"/angles/*.md

      # The phase's coordinator prompt, from ai-review/prompts.
      - name: Load prompt
        id: prompt
        run: |
          file=review.md
          if [ "$PHASE" = design ]; then file=design.md; fi
          {
            echo 'text<<AI_REVIEW_PROMPT_EOF'
            cat "ai-review-src/ai-review/prompts/$file"
            echo AI_REVIEW_PROMPT_EOF
          } >>"$GITHUB_OUTPUT"

      # The action writes github.token into ./.git/config, and /proc holds the
      # session's own key, so nothing in the session may read either. Bash,
      # file edits, web access and Skill are denied too: --add-dir can load
      # the PR's commands under any skill's name, so reviewers read the
      # miru-internal skills as files. The timeout stays under the job's so
      # Record verdict can still set an error status if the session hangs.
      - name: Review
        id: review
        if: env.PHASE == 'cleanup'
        timeout-minutes: 80
        uses: anthropics/claude-code-action@8ce9314fa9a404564fa7e954cd84f25bcba2b829 # v1.0.236
        env:
          # Keeps reviewers in the foreground, so the session waits for them.
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          allowed_bots: "dependabot[bot],stlc-sealback-bot[bot]"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            PR AUTHOR: ${{ github.event.pull_request.user.login }}
            HEAD SHA: ${{ github.event.pull_request.head.sha }}

            ${{ steps.prompt.outputs.text }}
          claude_args: |
            --model ${{ inputs.model }}
            --effort ${{ inputs.effort }}
            --max-turns 150
            --add-dir pr-head
            --agents '{"reviewer":{"description":"Reviews the PR from one angle and replies with its findings as JSON. Posts nothing.","prompt":"You review one pull request from one angle. First read ./ai-review-context/reviewer.md and follow it. Your task names the file that describes your angle.","tools":["Read","Grep","Glob"],"model":"inherit","maxTurns":100}}'
            --allowedTools "Read,Grep,Glob,Agent,Task,mcp__github_inline_comment__create_inline_comment"
            --disallowedTools "Read(./.git/**),Read(//proc/**),Bash,Write,Edit,NotebookEdit,WebFetch,WebSearch,Skill"
            --json-schema '{"type":"object","properties":{"verdict":{"type":"string","enum":["approve","request_changes"]},"summary":{"type":"string"},"blocking_findings":{"type":"array","items":{"type":"object","properties":{"file":{"type":"string"},"line":{"type":"integer"},"description":{"type":"string"}},"required":["file","description"]}},"angles":{"type":"array","items":{"type":"string"}}},"required":["verdict","summary","blocking_findings","angles"]}'

      # Drafts only. One session, no sub-agents: it reads the skill as a
      # file and posts its own inline comments. Same tool limits as Review.
      - name: Design review
        id: design
        if: env.PHASE == 'design'
        timeout-minutes: 80
        uses: anthropics/claude-code-action@8ce9314fa9a404564fa7e954cd84f25bcba2b829 # v1.0.236
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          allowed_bots: "dependabot[bot],stlc-sealback-bot[bot]"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            PR AUTHOR: ${{ github.event.pull_request.user.login }}
            HEAD SHA: ${{ github.event.pull_request.head.sha }}

            ${{ steps.prompt.outputs.text }}
          claude_args: |
            --model ${{ inputs.model }}
            --effort ${{ inputs.effort }}
            --max-turns 100
            --add-dir pr-head
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment"
            --disallowedTools "Read(./.git/**),Read(//proc/**),Bash,Write,Edit,NotebookEdit,WebFetch,WebSearch,Skill,Agent,Task"
            --json-schema '{"type":"object","properties":{"summary":{"type":"string"}},"required":["summary"]}'

      # Drafts only: edits the one design summary comment. No status.
      - name: Record design review
        if: always() && env.PHASE == 'design'
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.design.outputs.structured_output }}
          COMMENT_ID: ${{ steps.context.outputs.comment_id }}
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          # Removing the label lets someone add it again for another run.
          if [ "$EVENT_ACTION" = labeled ]; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels/ai-design-review" >/dev/null \
              || echo "::warning::Couldn't remove the ai-design-review label"
          fi
          summary=$(jq -r '.summary // empty' <<<"${RESULT:-}" 2>/dev/null || true)
          if [ -z "$summary" ]; then
            echo "::error::Design review produced no summary"
            exit 1
          fi
          body="### AI design review: \`${SHA:0:7}\`

          $summary

          Advisory: design comments don't block the PR. Add the \`ai-design-review\` label for another design review, or mark the PR ready for the required review.

          [Review run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
          echo "$body" >>"$GITHUB_STEP_SUMMARY"
          if [ -z "$COMMENT_ID" ] || ! gh api -X PATCH \
            "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" \
            -f body="$body" >/dev/null; then
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body" >/dev/null
          fi

      # Fail closed: any error, timeout, missing angle or missing verdict
      # leaves the required status non-green.
      - name: Record verdict
        if: always() && env.PHASE == 'cleanup'
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.review.outputs.structured_output }}
          COMMENT_ID: ${{ steps.context.outputs.comment_id }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          set_status() {
            gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
              -f state="$1" -f context="$STATUS_CONTEXT" \
              -f description="$2" -f target_url="$run_url" >/dev/null
          }
          fail() {
            set_status error "Review did not complete; see the run log"
            echo "::error::$1"
            exit 1
          }

          verdict=$(jq -r '.verdict // empty' <<<"${RESULT:-}" 2>/dev/null || true)
          case "$verdict" in
          approve) state=success description="Approved by Claude" ;;
          request_changes) state=failure description="Claude found blocking issues" ;;
          *) fail "AI review produced no verdict" ;;
          esac
          want=$(printf '%s\n' ai-review-context/angles/*.md | jq -Rnr '[inputs | sub(".*/"; "") | rtrimstr(".md")] | unique | join(",")')
          got=$(jq -r '[.angles[] | gsub("[\r\n]"; " ") | sub(".*/"; "") | rtrimstr(".md")] | unique | join(",")' <<<"$RESULT")
          [ "$got" = "$want" ] || fail "Reviewers that replied ($got) don't match the angles run ($want)"

          summary=$(jq -r '.summary' <<<"$RESULT")
          findings=$(jq -r '.blocking_findings[]
            | "- `\(.file)\(if .line then ":\(.line)" else "" end)`: \(.description)"' \
            <<<"$RESULT")
          # One summary comment per PR, edited each round.
          body="### AI review: ${verdict/_/ } for \`${SHA:0:7}\`

          $summary
          ${findings:+
          **Blocking findings**

          $findings
          }
          [Review run]($run_url)
          <!-- ai-review sha=$SHA -->"

          echo "$body" >>"$GITHUB_STEP_SUMMARY"
          if [ -z "$COMMENT_ID" ] || ! gh api -X PATCH \
            "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" \
            -f body="$body" >/dev/null; then
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body" >/dev/null
          fi
          set_status "$state" "$description"
          [ "$state" = success ]
