# Required AI review of every non-draft PR, and an advisory design review
# of drafts. Posts the `ai-review` status checked by branch protection.
# See ai-review.yml for details.
#
# pull_request_target runs this file, and the local reusable workflow it
# calls, from the base branch, so a PR cannot edit or delete its own review.

name: AI Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, labeled]

# Draft and label events each get their own group, so they never cancel a
# running review.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}-${{ (github.event.pull_request.draft || github.event.action == 'labeled') && github.run_id || 'review' }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  ai-review:
    uses: ./.github/workflows/ai-review.yml
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
