name: Surface Lint

on:
  workflow_call:
    inputs:
      runs-on:
        description: "Runner label"
        type: string
        default: "ubuntu-latest"
      shellcheck-ignore:
        description: "Space-separated paths to exclude from shell script linting"
        type: string
        default: ""

jobs:
  surface-lint:
    timeout-minutes: 10
    name: surface-lint
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # yamllint disable rule:line-length
      - name: Lint YAML
        uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c # v3.1.1
        with:
          file_or_dir: .
          config_file: .yamllint.yml

      - name: Lint Shell Scripts
        # yamllint disable rule:line-length
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: ./scripts
          ignore_paths: ${{ inputs.shellcheck-ignore }}

      # Download a pinned actionlint release instead of using the
      # rhysd/actionlint action, which builds it from source in Docker on
      # every run (about 20s). To bump: change ACTIONLINT_VERSION and copy
      # both linux hashes from that release's actionlint_<ver>_checksums.txt.
      - name: Lint GitHub Actions Workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256_AMD64: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          ACTIONLINT_SHA256_ARM64: 325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6
        run: |
          set -euo pipefail
          case "$RUNNER_ARCH" in
            X64) arch=amd64; sha256="$ACTIONLINT_SHA256_AMD64" ;;
            ARM64) arch=arm64; sha256="$ACTIONLINT_SHA256_ARM64" ;;
            *) echo "::error::No pinned actionlint for runner arch $RUNNER_ARCH"; exit 1 ;;
          esac
          # actionlint checks run: scripts with shellcheck only when it is on
          # PATH. The old Docker image bundled it, so install it if missing.
          command -v shellcheck >/dev/null \
            || { sudo apt-get update -q && sudo apt-get install -y -q shellcheck; }
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_${arch}.tar.gz"
          dir="$RUNNER_TEMP/actionlint"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "$sha256  $dir/$tarball" | sha256sum -c -
          tar -xzf "$dir/$tarball" -C "$dir" actionlint
          "$dir/actionlint" -version
          "$dir/actionlint"
